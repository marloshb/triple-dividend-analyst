<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Triple Dividend Climate Platform</title>
    <script>
      // SPA fallback for GitHub Pages (rafgraph/spa-github-pages technique).
      // Rewrites /triple-dividend-analyst/foo/bar into
      // /triple-dividend-analyst/?/foo/bar and redirects.
      // index.html then restores the real path via history.replaceState.
      (function () {
        var segmentCount = 1; // "/triple-dividend-analyst" => 1
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
